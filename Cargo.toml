[package]
name = "fuzgit"
version = "0.1.0"
edition = "2024"
description = "fuzzy finder で「選ぶ」「探す」「辿る」git 操作 CLI ツール"
license = "MIT"
repository = "https://github.com/nasu-hayato/fuzgit"

[lib]
name = "fuzgit"
path = "src/lib.rs"

[[bin]]
name = "gz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
gix = "0.86.0"
# `SkimItem::display` が返す `ratatui::text::Line` を組み立てるために直接依存する（skim は ratatui を re-export しない）。
# バージョンは skim が要求する系列（0.30）に固定する。より新しい系列を指定すると ratatui が 2 つ並び、
# `Line` が別の型になって skim へ渡せなくなるため、ここでは「最新版を採る」のではなく skim に合わせるのが正しい。
ratatui = "0.30"
# ライブラリとしてのみ利用するため、`sk` バイナリ用の cli / 画像プレビュー / IPC listen 機能は無効化する
skim = { version = "5.6.1", default-features = false, features = ["frizbee"] }
thiserror = "2.0.19"
# 候補一覧の列揃え（`commands::align_columns`）で端末上の表示幅を測るために使う。
# 全角文字は 2 セル幅であり、文字数でパディングすると端末では桁が合わないため。
# 0.2.2 は crates.io の最新版であると同時に、skim 経由で既に依存ツリーへ入っている系列でもあり、
# 直接依存に加えても推移依存は増えない。
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
